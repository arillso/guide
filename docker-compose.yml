services:
    arillso-doc-generator:
        build:
            context: .
            target: docs
        environment:
            # No writable home for an arbitrary UID; npm and ansible need one.
            - HOME=/tmp
            # Keep the collection cache in the checkout (git-ignored) so it
            # survives container restarts instead of re-downloading each time.
            - ARILLSO_COLLECTIONS_CACHE=/project/.cache/collections
        volumes:
            - ".:/project"
        working_dir: /project
        command:
            - bash
            - -c
            # Drop from root to the owner of the bind-mounted checkout, so build
            # outputs are not root-owned on the host, whatever the host UID.
            # `$$` escapes `$` from compose interpolation.
            - >-
                exec setpriv --reuid="$$(stat -c %u /project)"
                --regid="$$(stat -c %g /project)" --clear-groups
                bash -c './build.sh && python -m http.server 8000 --directory build/html'
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.arillso-guide-test-arillso-doc-generator.rule=Host(`arillso-guide.test`)"
            - "traefik.http.routers.arillso-guide-test-arillso-doc-generator-tls.rule=Host(`arillso-guide.test`)"
            - "traefik.http.routers.arillso-guide-test-arillso-doc-generator-tls.tls=true"
            # No host port is published, so tell Traefik which container port to
            # reach over the compose network (the python http.server in command).
            - "traefik.http.services.arillso-guide-test-arillso-doc-generator.loadbalancer.server.port=8000"
