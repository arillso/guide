---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

on:
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    actions: read
    pull-requests: read
    security-events: write

jobs:
    codeql-python:
        uses: arillso/.github/.github/workflows/security-codeql.yml@2026-08-12
        with:
            language: python

    codeql-javascript:
        uses: arillso/.github/.github/workflows/security-codeql.yml@2026-08-12
        with:
            language: javascript

    security-secrets:
        uses: arillso/.github/.github/workflows/security-secrets.yml@2026-08-12

    security-sbom:
        uses: arillso/.github/.github/workflows/security-sbom.yml@2026-08-12
        permissions:
            contents: write
        with:
            artifact-type: filesystem
            artifact-ref: .
